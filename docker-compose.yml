version: "3.8"

services:
  apkx-web:
    build:
      context: .
    image: apkx-web:latest
    container_name: apkx-web
    ports:
      - "9090:9090"
    environment:
      # Set the project root
      - APKX_ROOT=/app
      # Set individual paths
      - APKX_UPLOAD_DIR=/app/web-data/uploads
      - APKX_REPORTS_DIR=/app/web-data/reports
      - APKX_DOWNLOAD_DIR=/app/web-data/downloads
      - APKX_PATTERNS_PATH=/app/config/regexes.yaml
      # iOS download keychain passphrase
      - IPATOOL_KEYCHAIN_PASSPHRASE=sallam@88
      # Optional: Set a default Discord webhook
      # - DISCORD_WEBHOOK=your_webhook_url_here
    volumes:
      # Mount the entire project directory for source code and config
      - .:/app
    command: ["/usr/local/bin/apkx-web", "-addr", ":9090"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


