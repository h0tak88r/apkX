# GitLab Storage Docker Compose configuration for apkX
# This version uses GitLab as storage backend - much smaller!

version: '3.8'

services:
  apkx-web-gitlab:
    build:
      context: .
      dockerfile: Dockerfile.gitlab
    container_name: apkx-web-gitlab
    ports:
      - "9090:9090"
    environment:
      # GitLab Storage Configuration
      - USE_GITLAB_STORAGE=true
      - GITLAB_PROJECT=${GITLAB_PROJECT:-e9101230/apkx}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      
      # Application Configuration
      - APKX_PATTERNS_PATH=/app/config/regexes.yaml
      - APKX_TEMP_DIR=/tmp/apkx
      
      # Optional: Discord webhook
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# No volumes needed! All files stored in GitLab
# This makes the container much smaller and portable
