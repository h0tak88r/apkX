version: "3.8"

services:
  apkx-web:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: apkx-web:slim
    container_name: apkx-web-public
    ports:
      - "0.0.0.0:9090:9090"  # Bind to all interfaces on port 9090
    environment:
      # Set the project root
      - APKX_ROOT=/app
      # Set individual paths
      - APKX_UPLOAD_DIR=/app/web-data/uploads
      - APKX_REPORTS_DIR=/app/web-data/reports
      - APKX_DOWNLOAD_DIR=/app/web-data/downloads
      - APKX_PATTERNS_PATH=/app/config/regexes.yaml
      # ipatool keychain passphrase for iOS downloads
      - IPATOOL_KEYCHAIN_PASSPHRASE=sallam@88
      # Optional: Set a default Discord webhook
      # - DISCORD_WEBHOOK=your_webhook_url_here
    volumes:
      # Mount the entire project directory for source code and config
      - .:/app
      # Mount specific data directories for persistence
      - ./web-data/uploads:/app/web-data/uploads
      - ./web-data/reports:/app/web-data/reports
      - ./web-data/downloads:/app/web-data/downloads
      # Mount ipatool keychain for iOS downloads
      - /home/sallam/.ipatool:/root/.ipatool
    command: ["/usr/local/bin/apkx-web", "-addr", ":9090"]
    user: "0:0"  # Run as root to fix permissions issue
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
