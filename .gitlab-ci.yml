# GitLab CI/CD Pipeline for apkX
# This pipeline builds Docker images, runs tests, and deploys to GitLab Pages

stages:
  - build
  - test
  - package
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  APKX_VERSION: $CI_COMMIT_TAG
  APKX_VERSION: ${APKX_VERSION:-$CI_COMMIT_SHORT_SHA}

# Build stage - Build Go binaries
build:go:
  stage: build
  image: golang:1.21-alpine
  before_script:
    - apk add --no-cache git
  script:
    - go mod download
    - go build -o apkx cmd/apkx/main.go
    - go build -o apkx-web cmd/server/main.go
    - ls -la apkx apkx-web
  artifacts:
    paths:
      - apkx
      - apkx-web
    expire_in: 1 hour

# Test stage - Run tests
test:go:
  stage: test
  image: golang:1.21-alpine
  before_script:
    - apk add --no-cache git
  script:
    - go mod download
    - go test ./...
  dependencies:
    - build:go

# Package stage - Build Docker images
package:docker:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build main Docker image
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
    
    # Build slim Docker image
    - docker build -f Dockerfile.slim -t $CI_REGISTRY_IMAGE:slim-$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:slim .
    - docker push $CI_REGISTRY_IMAGE:slim-$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:slim
    
    # Tag with version if it's a tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker tag $CI_REGISTRY_IMAGE:slim-$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:slim-$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
        docker push $CI_REGISTRY_IMAGE:slim-$CI_COMMIT_TAG
      fi
  dependencies:
    - build:go
  only:
    - main
    - develop
    - tags

# Deploy to GitLab Pages
deploy:pages:
  stage: deploy
  image: node:18-alpine
  before_script:
    - apk add --no-cache go git
  script:
    # Build the web application
    - go mod download
    - go build -o apkx-web cmd/server/main.go
    
    # Create a simple static site for GitLab Pages
    - mkdir -p public
    - echo "<!DOCTYPE html>" > public/index.html
    - echo "<html><head><title>apkX - Mobile App Analysis Tool</title></head>" >> public/index.html
    - echo "<body><h1>apkX - Mobile App Analysis Tool</h1>" >> public/index.html
    - echo "<p>Advanced mobile app analysis tool with intelligent caching, pattern matching, and comprehensive security vulnerability detection.</p>" >> public/index.html
    - echo "<h2>Quick Start with Docker</h2>" >> public/index.html
    - echo "<pre><code># Pull and run the latest image" >> public/index.html
    - echo "docker run --rm -p 9090:9090 \\" >> public/index.html
    - echo "  -v \$(pwd)/web-data:/web-data \\" >> public/index.html
    - echo "  -v \$(pwd)/config:/config \\" >> public/index.html
    - echo "  -e APKX_UPLOAD_DIR=/web-data/uploads \\" >> public/index.html
    - echo "  -e APKX_REPORTS_DIR=/web-data/reports \\" >> public/index.html
    - echo "  -e APKX_DOWNLOAD_DIR=/web-data/downloads \\" >> public/index.html
    - echo "  -e APKX_PATTERNS_PATH=/config/regexes.yaml \\" >> public/index.html
    - echo "  $CI_REGISTRY_IMAGE:latest</code></pre>" >> public/index.html
    - echo "<h2>Features</h2>" >> public/index.html
    - echo "<ul>" >> public/index.html
    - echo "<li>🔍 Pattern-Based Analysis with 1652+ patterns</li>" >> public/index.html
    - echo "<li>🛡️ Comprehensive Security Vulnerability Detection</li>" >> public/index.html
    - echo "<li>📊 Beautiful HTML Reports with interactive visualization</li>" >> public/index.html
    - echo "<li>⚡ Performance & Efficiency with smart caching</li>" >> public/index.html
    - echo "<li>🌐 Modern Web Portal Interface</li>" >> public/index.html
    - echo "<li>🐳 Docker Support with one-command setup</li>" >> public/index.html
    - echo "</ul>" >> public/index.html
    - echo "<h2>Documentation</h2>" >> public/index.html
    - echo "<p>For detailed documentation, see the <a href=\"https://gitlab.com/$CI_PROJECT_PATH/-/blob/main/README.md\">README.md</a> file.</p>" >> public/index.html
    - echo "</body></html>" >> public/index.html
    
    # Copy README as documentation
    - cp README.md public/README.md
    - cp INSTALL.md public/INSTALL.md
    - cp DOCKER.md public/DOCKER.md
    - cp LICENSE public/LICENSE
  artifacts:
    paths:
      - public
    expire_in: 30 days
  dependencies:
    - build:go
  only:
    - main

# Security scanning (optional)
security:scan:
  stage: test
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  dependencies:
    - package:docker
  allow_failure: true
  only:
    - main
    - develop
