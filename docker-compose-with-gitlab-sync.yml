# Docker Compose with GitLab Auto-Sync
# Runs the ORIGINAL full-featured apkX server + background GitLab sync daemon

version: '3.8'

services:
  # Original apkX web server with ALL features
  apkx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apkx-web
    ports:
      - "9090:9090"
    volumes:
      - ./web-data:/web-data
      - ./config:/config
    environment:
      - APKX_ROOT=/app
      - APKX_UPLOAD_DIR=/web-data/uploads
      - APKX_REPORTS_DIR=/web-data/reports
      - APKX_DOWNLOAD_DIR=/web-data/downloads
      - APKX_PATTERNS_PATH=/config/regexes.yaml
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background GitLab sync daemon
  gitlab-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: apkx-gitlab-sync
    volumes:
      - ./web-data:/web-data:ro  # Read-only access
    environment:
      - GITLAB_PROJECT=${GITLAB_PROJECT:-e9101230/apkx}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
    restart: unless-stopped
    depends_on:
      - apkx-web

