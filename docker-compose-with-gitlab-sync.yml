# Docker Compose with GitLab Auto-Sync
# Runs the ORIGINAL full-featured apkX server + background GitLab sync daemon

version: '3.8'

services:
  # apkX web server with GitLab storage (NO local storage!)
  apkx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apkx-web
    ports:
      - "0.0.0.0:9090:9090"  # Bind to all interfaces (public IP)
    volumes:
      - ./config:/config  # Only config needed
    environment:
      # GitLab Storage Configuration
      - USE_GITLAB_STORAGE=true
      - GITLAB_PROJECT=${GITLAB_PROJECT:-e9101230/apkx}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - APKX_TEMP_DIR=/tmp/apkx
      
      # Application Configuration
      - APKX_ROOT=/app
      - APKX_PATTERNS_PATH=/config/regexes.yaml
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

